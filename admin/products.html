<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crazy Cloths — Products Catalog</title>

  <!-- Auth guard script loaded at the very top -->
  <script src="js/admin-auth.js"></script>

  <!-- External/Local Fonts and Styles -->
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
  
  <!-- Admin Stylesheet -->
  <link rel="stylesheet" href="css/admin.css">
</head>
<body data-page="products">

  <!-- Top YouTube-style Loading Bar -->
  <div class="top-loading-bar"></div>

  <!-- Page Transition Overlay -->
  <div class="page-transition-overlay" id="page-transition-overlay"></div>

  <div class="admin-layout">
    
    <!-- FIXED LEFT SIDEBAR -->
    <aside class="admin-sidebar" id="admin-sidebar">
      <div class="admin-sidebar-logo-area">
        <div class="admin-sidebar-logo">CRAZY<span>CLOTHS</span></div>
        <div class="admin-badge-red">Admin</div>
      </div>
      
      <ul class="admin-nav-list">
        <li class="admin-nav-item">
          <a href="dashboard.html">
            <span class="icon">🏠</span>
            <span>Dashboard</span>
          </a>
        </li>
        <li class="admin-nav-item">
          <a href="orders.html">
            <span class="icon">📦</span>
            <span>Orders</span>
          </a>
        </li>
        <li class="admin-nav-item active">
          <a href="products.html">
            <span class="icon">👕</span>
            <span>Products</span>
          </a>
        </li>
        <li class="admin-nav-item">
          <a href="users.html">
            <span class="icon">👥</span>
            <span>Users</span>
          </a>
        </li>
        <li class="admin-nav-item">
          <a href="#" onclick="AuthService.logout()">
            <span class="icon">🚪</span>
            <span>Logout</span>
          </a>
        </li>
      </ul>

      <!-- Logged-in admin profile footer -->
      <div class="admin-sidebar-profile">
        <div class="admin-profile-avatar" id="admin-avatar-circle">A</div>
        <div class="admin-profile-info">
          <span class="admin-profile-name">Administrator</span>
          <span class="admin-profile-email" id="admin-email-display">admin@crazycloths.com</span>
        </div>
      </div>
    </aside>

    <!-- Mobile Drawer Backdrop -->
    <div class="admin-sidebar-backdrop" id="sidebar-backdrop" onclick="toggleMobileSidebar(false)"></div>

    <!-- CONTENT WRAPPER -->
    <div class="admin-content-wrapper">
      
      <!-- FIXED TOPBAR -->
      <header class="admin-topbar">
        <div style="display:flex; align-items:center; gap:1rem;">
          <button class="admin-mobile-toggle" onclick="toggleMobileSidebar(true)" aria-label="Open Sidebar">☰</button>
          <h2 class="admin-page-title">Products Catalog</h2>
        </div>

        <div class="admin-topbar-right">
          <div class="admin-live-clock" id="topbar-clock">Loading time...</div>
          
          <button class="admin-notification-bell" id="topbar-bell" aria-label="Notifications" onclick="window.location.href='orders.html'">
            🔔
            <span class="admin-notification-badge" id="topbar-bell-badge" style="display:none;">0</span>
          </button>
        </div>
      </header>

      <!-- MAIN CONTENT -->
      <main class="admin-main-content">
        
        <!-- HEADER CONTROL BAR -->
        <div class="admin-card" style="margin-bottom: 2rem; display:flex; justify-content:space-between; align-items:center;">
          <h3 class="admin-chart-title" style="margin:0;">Products List</h3>
          <button class="admin-btn admin-btn-primary" onclick="toggleProductPanel(true)">
            ➕ Add New Product
          </button>
        </div>

        <!-- PRODUCTS RESPONSIVE GRID -->
        <div class="admin-products-grid" id="products-grid">
          <!-- Loaded dynamically via admin-products.js -->
        </div>

      </main>
    </div>
  </div>

  <!-- SLIDE-IN ADD/EDIT PRODUCT PANEL -->
  <div class="admin-panel-backdrop" id="product-panel-backdrop" onclick="toggleProductPanel(false)"></div>
  <div class="admin-slide-panel" id="product-slide-panel">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem; border-bottom:1px solid var(--admin-border); padding-bottom:1rem;">
      <h3 class="admin-chart-title" id="panel-title" style="margin:0;">Add New Product</h3>
      <button class="admin-btn admin-btn-secondary" style="padding:0.4rem 0.8rem; font-size:0.8rem;" onclick="toggleProductPanel(false)">Close</button>
    </div>

    <form id="product-form" style="display:flex; flex-direction:column; gap:1.25rem;">
      
      <!-- Product Name -->
      <div class="admin-form-group">
        <label class="admin-form-label" for="product-name">Product Name *</label>
        <input type="text" id="product-name" class="admin-input" style="width:100%;" placeholder="e.g. Classic Oversized Tee" required>
      </div>

      <!-- Product Type -->
      <div class="admin-form-group">
        <label class="admin-form-label" for="product-type">Product Type *</label>
        <select id="product-type" class="admin-select" style="width:100%;">
          <option value="Oversized T-Shirt">Oversized T-Shirt</option>
          <option value="Polo T-Shirt">Polo T-Shirt</option>
          <option value="Round Neck T-Shirt">Round Neck T-Shirt</option>
          <option value="Sleeveless T-Shirt">Sleeveless T-Shirt</option>
          <option value="Full Sleeve T-Shirt">Full Sleeve T-Shirt</option>
        </select>
      </div>

      <!-- Color -->
      <div class="admin-form-group">
        <label class="admin-form-label" for="product-color">Color *</label>
        <select id="product-color" class="admin-select" style="width:100%;">
          <option value="white">White</option>
          <option value="black">Black</option>
        </select>
      </div>

      <!-- Price -->
      <div class="admin-form-group">
        <label class="admin-form-label" for="product-price">Price (₹) *</label>
        <input type="number" id="product-price" class="admin-input" style="width:100%;" min="1" value="499" required>
      </div>

      <!-- Toggles: Stock & Customizable -->
      <div style="display:flex; gap:2rem; margin:0.5rem 0;">
        <!-- Stock Status Toggle -->
        <div class="admin-form-group">
          <label class="admin-form-label" style="margin-bottom:0.4rem;">In Stock</label>
          <div class="admin-toggle-wrapper">
            <label class="admin-toggle-switch">
              <input type="checkbox" id="product-stock" checked>
              <span class="admin-toggle-slider"></span>
            </label>
          </div>
        </div>

        <!-- Customizable Toggle -->
        <div class="admin-form-group">
          <label class="admin-form-label" style="margin-bottom:0.4rem;">Customizable</label>
          <div class="admin-toggle-wrapper">
            <label class="admin-toggle-switch">
              <input type="checkbox" id="product-custom" checked>
              <span class="admin-toggle-slider"></span>
            </label>
          </div>
        </div>
      </div>

      <!-- Drag & Drop Zone for Image Upload -->
      <div class="admin-form-group">
        <label class="admin-form-label">Product Image *</label>
        
        <div class="admin-dropzone" id="product-dropzone">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
          </svg>
          <span style="font-weight:600; font-size:0.85rem;">Drag image here or click to upload</span>
          <p style="font-size:0.7rem; color:var(--admin-text-muted);">PNG, JPG, SVG up to 10MB</p>
          
          <input type="file" id="product-file-input" style="display:none;" accept="image/*">
          
          <!-- Dropzone preview area -->
          <div class="admin-dropzone-preview" id="dropzone-preview-container" onclick="event.stopPropagation()">
            <img id="dropzone-preview-img" src="" alt="Preview">
            <button type="button" class="admin-btn admin-btn-secondary" style="padding:0.4rem 0.8rem; font-size:0.75rem;" onclick="clearDragAndDrop()">Change Image</button>
          </div>
        </div>
      </div>

      <button type="submit" id="product-save-btn" class="admin-btn admin-btn-primary" style="width:100%; padding:0.8rem; margin-top:1rem;">
        Save Product
      </button>

    </form>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  
  <script src="../config.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth.js"></script>
  
  <!-- Orders controller handles the clock and topbar alert badges -->
  <script src="js/admin-orders.js"></script>
  
  <!-- Products page controllers -->
  <script src="js/admin-products.js"></script>

  <!-- Local Script: Responsive Toggle -->
  <script>
    function toggleMobileSidebar(show) {
      const sidebar = document.getElementById('admin-sidebar');
      const backdrop = document.getElementById('sidebar-backdrop');
      if (show) {
        sidebar.classList.add('active');
        backdrop.classList.add('active');
      } else {
        sidebar.classList.remove('active');
        backdrop.classList.remove('active');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Load user profile details
      if (typeof AuthService !== 'undefined') {
        const email = AuthService.getEmail() || 'admin@crazycloths.com';
        document.getElementById('admin-email-display').textContent = email;
        const initial = email.charAt(0).toUpperCase();
        document.getElementById('admin-avatar-circle').textContent = initial;
      }
    });
  </script>
</body>
</html>
