<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crazy Cloths — Admin Products</title>
  
  <!-- Inline Script to prevent theme flash -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('cc_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>

  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
  
  <style>
    /* Admin catalog overrides for modern streetwear cards */
    .admin-product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }
    .admin-product-card {
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform 0.3s, border-color 0.3s;
      position: relative;
    }
    .admin-product-card:hover {
      border-color: var(--color-accent);
      transform: translateY(-4px);
    }
    .admin-product-img {
      width: 100%;
      aspect-ratio: 1.1;
      overflow: hidden;
      border-bottom: 1px solid var(--color-border);
      background-color: var(--color-bg-2);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .admin-product-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s;
    }
    .admin-product-card:hover .admin-product-img img {
      transform: scale(1.04);
    }
    .admin-product-info {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .admin-product-info strong {
      font-family: var(--font-display);
      font-size: 1.3rem;
      color: var(--color-text-primary);
      letter-spacing: 0.03em;
    }
    .admin-product-info span {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--color-text-secondary);
    }
    .admin-product-actions {
      padding: 1rem 1.25rem;
      border-top: 1px solid var(--color-border);
      display: flex;
      gap: 0.75rem;
      margin-top: auto;
      background-color: var(--color-bg-3);
    }
    .admin-product-actions button {
      flex: 1;
      padding: 0.5rem;
      font-size: 0.85rem;
    }
  </style>
</head>
<body data-page="products">

  <!-- Top YouTube-style Loading Bar -->
  <div class="top-loading-bar"></div>

  <!-- Page Transition Overlay -->
  <div class="page-transition-overlay" id="page-transition-overlay"></div>



  <div class="admin-layout">
    <!-- Fixed Left Sidebar -->
    <aside class="admin-sidebar">
      <div class="admin-logo">CRAZY<span>CLOTHS</span></div>
      
      <ul class="admin-nav-list">
        <li class="admin-nav-item">
          <a href="dashboard.html">
            <span class="icon">📊</span>
            <span>Overview</span>
          </a>
        </li>
        <li class="admin-nav-item active">
          <a href="products.html">
            <span class="icon">👕</span>
            <span>Products</span>
          </a>
        </li>
        <li class="admin-nav-item">
          <a href="../index.html">
            <span class="icon">🌐</span>
            <span>Storefront</span>
          </a>
        </li>
      </ul>

      <div class="admin-user-info">
        <div class="admin-avatar" id="admin-avatar">A</div>
        <div style="display: flex; flex-direction: column; overflow: hidden;">
          <span style="font-family: var(--font-display); font-size: 1rem; color: #ffffff; text-transform: uppercase;">Admin</span>
          <span id="admin-email-display" style="font-family:var(--font-mono);font-size:0.7rem;color:#666666;text-overflow:ellipsis;overflow:hidden;white-space:nowrap;"></span>
        </div>
      </div>
      
      <button id="logout-btn" class="btn btn-secondary" style="margin-top:1.5rem;padding:0.6rem 1rem;font-size:0.85rem;width:100%;">Logout</button>
    </aside>

    <!-- Main Content Area -->
    <main class="admin-main">
      <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 3rem; border-bottom: 1px solid var(--color-border); padding-bottom: 1.5rem;">
        <h2 style="font-family:var(--font-display);font-size:3rem;text-transform:uppercase;letter-spacing:0.05em;margin:0;">Products Catalog</h2>
        
        <div style="display:flex; align-items:center; gap: 1.5rem;">
          <button class="btn btn-primary" onclick="toggleAddPanel(true)" style="padding: 0.6rem 1.5rem; font-size: 1rem;">+ Add Product</button>
          
          <!-- Theme Toggle -->
          <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Theme">
            <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m12.728 12.728l.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z" />
            </svg>
            <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
          </button>
        </div>
      </header>

      <!-- Slide-In Add Product Panel -->
      <div class="admin-panel-backdrop" id="panel-backdrop" onclick="toggleAddPanel(false)"></div>
      <div class="admin-slide-panel" id="add-product-panel">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 2rem;">
          <h3 style="font-family:var(--font-display); font-size: 2rem; text-transform: uppercase; letter-spacing: 0.05em; margin: 0;">Add New Product</h3>
          <button class="btn btn-secondary" onclick="toggleAddPanel(false)" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">Close</button>
        </div>
        
        <div id="add-product-msg" class="auth-message"></div>

        <form id="add-product-form" style="display:flex; flex-direction:column; gap: 1.5rem;">
          <div class="form-group">
            <label class="form-label" for="ap-name">Product Name</label>
            <input type="text" id="ap-name" class="form-input" placeholder="e.g. Classic White T-Shirt" required>
          </div>
          
          <div class="form-group">
            <label class="form-label" for="ap-type">Product Type</label>
            <select id="ap-type" class="form-select">
              <option value="T-Shirt">T-Shirt</option>
              <option value="Oversized T-Shirt">Oversized T-Shirt</option>
              <option value="Hoodie">Hoodie</option>
            </select>
          </div>
          
          <div class="form-group">
            <label class="form-label" for="ap-color">Color</label>
            <select id="ap-color" class="form-select">
              <option value="white">White</option>
              <option value="black">Black</option>
            </select>
          </div>
          
          <div class="form-group">
            <label class="form-label" for="ap-price">Price (₹)</label>
            <input type="number" id="ap-price" class="form-input" min="1" value="499" required>
          </div>
          
          <div class="form-group">
            <label class="form-label" for="ap-stock">Stock Status</label>
            <select id="ap-stock" class="form-select">
              <option value="inStock">In Stock</option>
              <option value="outOfStock">Out of Stock</option>
            </select>
          </div>
          
          <div class="form-group">
            <label class="form-label" for="ap-custom">Customizable?</label>
            <select id="ap-custom" class="form-select">
              <option value="yes">Yes (Allow custom design upload)</option>
              <option value="no">No (Plain shirt only)</option>
            </select>
          </div>
          
          <div class="form-group">
            <label class="form-label" for="ap-image">Product Image</label>
            <input type="file" id="ap-image" class="form-input" accept="image/*" required>
          </div>

          <button type="submit" id="add-product-btn" class="btn btn-accent btn-premium" style="margin-top: 1rem; width: 100%;">Add Product</button>
        </form>
      </div>

      <!-- Products Catalog Grid -->
      <div class="admin-product-grid" id="admin-product-grid">
        <!-- Loaded dynamically from admin.js -->
      </div>
    </main>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  
  <script src="../config.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin.js"></script>

  <!-- Visual/Interactive Scripting -->
  <script>
    // Toggle Slide-In Panel
    function toggleAddPanel(show) {
      const panel = document.getElementById('add-product-panel');
      const backdrop = document.getElementById('panel-backdrop');
      if (show) {
        panel.classList.add('active');
        backdrop.classList.add('active');
      } else {
        panel.classList.remove('active');
        backdrop.classList.remove('active');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Auto close panel on successful product add
      const addForm = document.getElementById('add-product-form');
      if (addForm) {
        addForm.addEventListener('submit', () => {
          setTimeout(() => {
            const msg = document.getElementById('add-product-msg');
            if (msg && msg.classList.contains('success')) {
              setTimeout(() => {
                toggleAddPanel(false);
              }, 1000);
            }
          }, 200);
        });
      }

      // Theme Toggle Logic
      const themeToggle = document.getElementById('theme-toggle');
      if (themeToggle) {
        themeToggle.addEventListener('click', () => {
          const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
          const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', newTheme);
          localStorage.setItem('cc_theme', newTheme);
        });
      }



      // Page Transition Sweep
      const overlay = document.getElementById('page-transition-overlay');
      if (overlay) {
        overlay.classList.add('active-out');
        setTimeout(() => { overlay.classList.remove('active-out'); }, 600);
        
        const links = document.querySelectorAll('a');
        links.forEach(link => {
          const href = link.getAttribute('href');
          if (href && !href.startsWith('#') && !href.startsWith('mailto:') && !link.getAttribute('target')) {
            link.addEventListener('click', (e) => {
              e.preventDefault();
              overlay.classList.add('active-in');
              setTimeout(() => { window.location.href = href; }, 550);
            });
          }
        });
      }
    });
  </script>
</body>
</html>
