<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crazy Cloths — Admin Products</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    .admin-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 1.5rem;
      margin-bottom: 2.5rem;
    }
    .admin-nav {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    .admin-nav a {
      font-family: var(--font-display);
      text-transform: uppercase;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
      color: var(--color-text-secondary);
      transition: color 0.2s ease;
    }
    .admin-nav a.active, .admin-nav a:hover {
      color: var(--color-accent);
    }
    .admin-card {
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      padding: 2rem;
      margin-bottom: 3rem;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.25rem;
      margin-bottom: 1.5rem;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .form-label {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--color-text-secondary);
      text-transform: uppercase;
    }
    .form-input, .form-select {
      background-color: transparent;
      border: 1px solid var(--color-border);
      padding: 0.75rem 1rem;
      color: var(--color-white);
      font-family: var(--font-body);
      font-size: 0.9rem;
    }
    .form-select option {
      background-color: var(--color-surface);
      color: var(--color-white);
    }
    .admin-product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }
    .admin-product-card {
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
    }
    .admin-product-img {
      width: 100%;
      aspect-ratio: 1.1;
      overflow: hidden;
      border-bottom: 1px solid var(--color-border);
      background-color: #0c0c0c;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .admin-product-img img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .admin-product-img .no-img {
      font-family: var(--font-mono);
      color: var(--color-text-secondary);
      font-size: 0.8rem;
    }
    .admin-product-info {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .admin-product-info strong {
      font-family: var(--font-display);
      font-size: 1.1rem;
      color: var(--color-white);
    }
    .admin-product-info span {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--color-text-secondary);
    }
    .admin-product-actions {
      padding: 1.25rem;
      border-top: 1px solid var(--color-border);
      display: flex;
      gap: 0.75rem;
      margin-top: auto;
    }
    .admin-product-actions button {
      flex: 1;
      padding: 0.5rem;
      font-size: 0.8rem;
    }
    .auth-message {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      padding: 0.6rem 0.8rem;
      margin-bottom: 1.5rem;
      border-left: 3px solid;
      display: none;
    }
    .auth-message.error {
      color: var(--color-accent);
      border-color: var(--color-accent);
      background-color: rgba(255, 60, 60, 0.07);
    }
    .auth-message.success {
      color: #4ade80;
      border-color: #4ade80;
      background-color: rgba(74, 222, 128, 0.07);
    }
    .auth-message.visible {
      display: block;
    }
    .stock-badge {
      display: inline-block;
      align-self: flex-start;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      text-transform: uppercase;
      padding: 2px 7px;
      margin-top: 0.25rem;
      letter-spacing: 0.05em;
    }
    .stock-badge.in-stock {
      background: rgba(74,222,128,0.15);
      color: #4ade80;
      border: 1px solid #4ade8055;
    }
    .stock-badge.out-of-stock {
      background: rgba(255,60,60,0.15);
      color: var(--color-accent);
      border: 1px solid var(--color-accent)44;
    }
  </style>
</head>
<body data-page="products">

  <div class="admin-container">
    <header class="admin-header">
      <a href="../index.html" class="logo">CRAZY<span>CLOTHS</span> <span style="font-size:0.8rem;font-family:var(--font-mono);color:var(--color-text-secondary);margin-left:0.5rem;">[ADMIN]</span></a>
      <div style="display:flex;align-items:center;gap:1.5rem;">
        <span id="admin-email-display" style="font-family:var(--font-mono);font-size:0.85rem;color:var(--color-text-secondary);"></span>
        <button id="logout-btn" class="btn btn-secondary" style="padding:0.5rem 1rem;font-size:0.85rem;">Logout</button>
      </div>
    </header>

    <nav class="admin-nav">
      <a href="dashboard.html">Overview</a>
      <a href="products.html" class="active">Products Catalog</a>
      <a href="../index.html">View Storefront</a>
    </nav>

    <main>
      <!-- Add Product Form -->
      <div class="admin-card">
        <h2 style="font-family:var(--font-display);font-size:1.5rem;margin-bottom:1.5rem;text-transform:uppercase;">Add New Product</h2>
        
        <div id="add-product-msg" class="auth-message"></div>

        <form id="add-product-form">
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="ap-name">Product Name</label>
              <input type="text" id="ap-name" class="form-input" placeholder="e.g. Classic White T-Shirt" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="ap-type">Product Type</label>
              <select id="ap-type" class="form-select">
                <option value="T-Shirt">T-Shirt</option>
                <option value="Oversized T-Shirt">Oversized T-Shirt</option>
                <option value="Hoodie">Hoodie</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="ap-color">Color</label>
              <select id="ap-color" class="form-select">
                <option value="white">White</option>
                <option value="black">Black</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="ap-price">Price (₹)</label>
              <input type="number" id="ap-price" class="form-input" min="1" value="499" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="ap-stock">Stock Status</label>
              <select id="ap-stock" class="form-select">
                <option value="inStock">In Stock</option>
                <option value="outOfStock">Out of Stock</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="ap-custom">Customizable?</label>
              <select id="ap-custom" class="form-select">
                <option value="yes">Yes (Allow custom design upload)</option>
                <option value="no">No (Plain shirt only)</option>
              </select>
            </div>
            <div class="form-group" style="grid-column: 1 / -1;">
              <label class="form-label" for="ap-image">Product Image</label>
              <input type="file" id="ap-image" class="form-input" accept="image/*" required>
            </div>
          </div>

          <button type="submit" id="add-product-btn" class="btn btn-accent btn-ripple" style="padding:0.75rem 2rem;">Add Product</button>
        </form>
      </div>

      <!-- Products Catalog Grid -->
      <h2 style="font-family:var(--font-display);font-size:1.5rem;margin-bottom:1.5rem;text-transform:uppercase;">Manage Catalog</h2>
      <div class="admin-product-grid" id="admin-product-grid">
        <!-- Loaded dynamically from admin.js -->
      </div>
    </main>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  
  <script src="../config.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
