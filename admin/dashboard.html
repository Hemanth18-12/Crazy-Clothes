<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crazy Cloths — Admin Dashboard</title>
  
  <!-- Inline Script to prevent theme flash -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('cc_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>

  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body data-page="dashboard">

  <!-- Top YouTube-style Loading Bar -->
  <div class="top-loading-bar"></div>

  <!-- Page Transition Overlay -->
  <div class="page-transition-overlay" id="page-transition-overlay"></div>



  <div class="admin-layout">
    <!-- Fixed Left Sidebar -->
    <aside class="admin-sidebar">
      <div class="admin-logo">CRAZY<span>CLOTHS</span></div>
      
      <ul class="admin-nav-list">
        <li class="admin-nav-item active">
          <a href="dashboard.html">
            <span class="icon">📊</span>
            <span>Overview</span>
          </a>
        </li>
        <li class="admin-nav-item">
          <a href="products.html">
            <span class="icon">👕</span>
            <span>Products</span>
          </a>
        </li>
        <li class="admin-nav-item">
          <a href="../index.html">
            <span class="icon">🌐</span>
            <span>Storefront</span>
          </a>
        </li>
      </ul>

      <div class="admin-user-info">
        <div class="admin-avatar" id="admin-avatar">A</div>
        <div style="display: flex; flex-direction: column; overflow: hidden;">
          <span style="font-family: var(--font-display); font-size: 1rem; color: #ffffff; text-transform: uppercase;">Admin</span>
          <span id="admin-email-display" style="font-family:var(--font-mono);font-size:0.7rem;color:#666666;text-overflow:ellipsis;overflow:hidden;white-space:nowrap;"></span>
        </div>
      </div>
      
      <button id="logout-btn" class="btn btn-secondary" style="margin-top:1.5rem;padding:0.6rem 1rem;font-size:0.85rem;width:100%;">Logout</button>
    </aside>

    <!-- Main Content Area -->
    <main class="admin-main">
      <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 3rem; border-bottom: 1px solid var(--color-border); padding-bottom: 1.5rem;">
        <h2 style="font-family:var(--font-display);font-size:3rem;text-transform:uppercase;letter-spacing:0.05em;margin:0;">Store Overview</h2>
        
        <!-- Theme Toggle -->
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Theme">
          <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m12.728 12.728l.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z" />
          </svg>
          <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
        </button>
      </header>
      
      <div class="stats-grid">
        <div class="stat-card reveal-on-scroll stagger-1">
          <div id="stat-total-products" class="stat-value">-</div>
          <div class="stat-label">Total Products</div>
        </div>
        <div class="stat-card reveal-on-scroll stagger-2">
          <div id="stat-orders-today" class="stat-value">-</div>
          <div class="stat-label">Orders Today</div>
        </div>
        <div class="stat-card reveal-on-scroll stagger-3">
          <div id="stat-orders-total" class="stat-value">-</div>
          <div class="stat-label">Total Orders (All Time)</div>
        </div>
      </div>
    </main>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  
  <script src="../config.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin.js"></script>

  <!-- Interactive/Visual Scripting -->
  <script>
    // Stats Count Up Animation
    function animateValue(obj, start, end, duration) {
      let startTimestamp = null;
      const step = (timestamp) => {
        if (!startTimestamp) startTimestamp = timestamp;
        const progress = Math.min((timestamp - startTimestamp) / duration, 1);
        obj.innerHTML = Math.floor(progress * (end - start) + start);
        if (progress < 1) {
          window.requestAnimationFrame(step);
        }
      };
      window.requestAnimationFrame(step);
    }

    // Monitor value changes from Firebase to trigger count up
    const observer = new MutationObserver((mutations) => {
      mutations.forEach((mutation) => {
        const val = parseInt(mutation.target.textContent);
        if (!isNaN(val) && !mutation.target.dataset.animated) {
          mutation.target.dataset.animated = "true";
          animateValue(mutation.target, 0, val, 1200);
        }
      });
    });

    document.addEventListener('DOMContentLoaded', () => {
      ['stat-total-products', 'stat-orders-today', 'stat-orders-total'].forEach(id => {
        const el = document.getElementById(id);
        if (el) observer.observe(el, { childList: true });
      });

      // Theme Toggle Logic
      const themeToggle = document.getElementById('theme-toggle');
      if (themeToggle) {
        themeToggle.addEventListener('click', () => {
          const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
          const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', newTheme);
          localStorage.setItem('cc_theme', newTheme);
        });
      }



      // Page Transition Sweep
      const overlay = document.getElementById('page-transition-overlay');
      if (overlay) {
        overlay.classList.add('active-out');
        setTimeout(() => { overlay.classList.remove('active-out'); }, 600);
        
        const links = document.querySelectorAll('a');
        links.forEach(link => {
          const href = link.getAttribute('href');
          if (href && !href.startsWith('#') && !href.startsWith('mailto:') && !link.getAttribute('target')) {
            link.addEventListener('click', (e) => {
              e.preventDefault();
              overlay.classList.add('active-in');
              setTimeout(() => { window.location.href = href; }, 550);
            });
          }
        });
      }
    });
  </script>
</body>
</html>
