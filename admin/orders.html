<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crazy Cloths — Orders Management</title>

  <!-- Auth guard script loaded at the very top -->
  <script src="js/admin-auth.js"></script>

  <!-- External/Local Fonts and Styles -->
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
  
  <!-- Admin Stylesheet -->
  <link rel="stylesheet" href="css/admin.css">
</head>
<body data-page="orders">

  <!-- Top YouTube-style Loading Bar -->
  <div class="top-loading-bar"></div>

  <!-- Page Transition Overlay -->
  <div class="page-transition-overlay" id="page-transition-overlay"></div>

  <div class="admin-layout">
    
    <!-- FIXED LEFT SIDEBAR -->
    <aside class="admin-sidebar" id="admin-sidebar">
      <div class="admin-sidebar-logo-area">
        <div class="admin-sidebar-logo">CRAZY<span>CLOTHS</span></div>
        <div class="admin-badge-red">Admin</div>
      </div>
      
      <ul class="admin-nav-list">
        <li class="admin-nav-item">
          <a href="dashboard.html">
            <span class="icon">🏠</span>
            <span>Dashboard</span>
          </a>
        </li>
        <li class="admin-nav-item active">
          <a href="orders.html">
            <span class="icon">📦</span>
            <span>Orders</span>
          </a>
        </li>
        <li class="admin-nav-item">
          <a href="products.html">
            <span class="icon">👕</span>
            <span>Products</span>
          </a>
        </li>
        <li class="admin-nav-item">
          <a href="users.html">
            <span class="icon">👥</span>
            <span>Users</span>
          </a>
        </li>
        <li class="admin-nav-item">
          <a href="#" onclick="AuthService.logout()">
            <span class="icon">🚪</span>
            <span>Logout</span>
          </a>
        </li>
      </ul>

      <!-- Logged-in admin profile footer -->
      <div class="admin-sidebar-profile">
        <div class="admin-profile-avatar" id="admin-avatar-circle">A</div>
        <div class="admin-profile-info">
          <span class="admin-profile-name">Administrator</span>
          <span class="admin-profile-email" id="admin-email-display">admin@crazycloths.com</span>
        </div>
      </div>
    </aside>

    <!-- Mobile Drawer Backdrop -->
    <div class="admin-sidebar-backdrop" id="sidebar-backdrop" onclick="toggleMobileSidebar(false)"></div>

    <!-- CONTENT WRAPPER -->
    <div class="admin-content-wrapper">
      
      <!-- FIXED TOPBAR -->
      <header class="admin-topbar">
        <div style="display:flex; align-items:center; gap:1rem;">
          <button class="admin-mobile-toggle" onclick="toggleMobileSidebar(true)" aria-label="Open Sidebar">☰</button>
          <h2 class="admin-page-title">Orders Management</h2>
        </div>

        <div class="admin-topbar-right">
          <div class="admin-live-clock" id="topbar-clock">Loading time...</div>
          
          <button class="admin-notification-bell" id="topbar-bell" aria-label="Notifications">
            🔔
            <span class="admin-notification-badge" id="topbar-bell-badge" style="display:none;">0</span>
          </button>
        </div>
      </header>

      <!-- MAIN CONTENT -->
      <main class="admin-main-content">
        
        <!-- FILTERS BAR -->
        <div class="admin-card" style="margin-bottom: 1.5rem;">
          <div class="admin-input-group" style="justify-content:space-between; width:100%;">
            
            <div style="display:flex; gap:1rem; flex-wrap:wrap; align-items:center;">
              <input type="text" id="order-search" class="admin-input" placeholder="Search Order ID or Name...">
              
              <select id="order-status-filter" class="admin-select">
                <option value="all">All Statuses</option>
                <option value="pending">Pending</option>
                <option value="confirmed">Confirmed</option>
                <option value="dispatched">Dispatched</option>
                <option value="delivered">Delivered</option>
              </select>

              <div style="display:flex; align-items:center; gap:0.5rem;">
                <span style="font-size:0.8rem; color:var(--admin-text-muted);">From:</span>
                <input type="date" id="order-date-from" class="admin-input" style="min-width:140px;">
                <span style="font-size:0.8rem; color:var(--admin-text-muted);">To:</span>
                <input type="date" id="order-date-to" class="admin-input" style="min-width:140px;">
              </div>
            </div>

            <button class="admin-btn admin-btn-primary" id="export-csv-btn" style="min-width:140px;">
              📤 Export CSV
            </button>
          </div>
        </div>

        <!-- ORDERS TABLE CARD -->
        <div class="admin-card">
          <div class="admin-table-container">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Order ID</th>
                  <th>Customer Name</th>
                  <th>Phone</th>
                  <th>Product</th>
                  <th>Design</th>
                  <th>Price</th>
                  <th>Order Date</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="orders-table-body">
                <tr>
                  <td colspan="9" style="text-align:center;">Loading orders database...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- ORDER DETAIL MODAL BACKDROP -->
  <div class="admin-modal-backdrop" id="order-detail-modal-backdrop" onclick="closeOrderModal()">
    <div class="admin-modal" id="order-detail-modal-content" onclick="event.stopPropagation()">
      <!-- Loaded dynamically via JS -->
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  
  <script src="../config.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth.js"></script>
  
  <!-- Orders controller containing both the core logic and notification triggers -->
  <script src="js/admin-orders.js"></script>

  <!-- Local Script: Page UI setup & deep linking filters -->
  <script>
    function toggleMobileSidebar(show) {
      const sidebar = document.getElementById('admin-sidebar');
      const backdrop = document.getElementById('sidebar-backdrop');
      if (show) {
        sidebar.classList.add('active');
        backdrop.classList.add('active');
      } else {
        sidebar.classList.remove('active');
        backdrop.classList.remove('active');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Load user profile details
      if (typeof AuthService !== 'undefined') {
        const email = AuthService.getEmail() || 'admin@crazycloths.com';
        document.getElementById('admin-email-display').textContent = email;
        const initial = email.charAt(0).toUpperCase();
        document.getElementById('admin-avatar-circle').textContent = initial;
      }

      // Check if user redirected from Users page with email filter
      setTimeout(() => {
        const filterEmail = sessionStorage.getItem('admin_orders_filter_email');
        if (filterEmail) {
          sessionStorage.removeItem('admin_orders_filter_email');
          const searchInput = document.getElementById('order-search');
          if (searchInput) {
            searchInput.value = filterEmail;
            // Trigger input event to filter table
            searchInput.dispatchEvent(new Event('input'));
          }
        }
      }, 600);
    });
  </script>
</body>
</html>
