<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crazy Cloths — Login</title>
  
  <!-- Inline Script to prevent theme flash -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('cc_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <!-- Top Loading Bar -->
  <div class="top-loading-bar"></div>

  <!-- Page Transition Overlay -->
  <div class="page-transition-overlay" id="page-transition-overlay"></div>

  <div class="auth-split-container">
    
    <!-- LEFT: Brand Panel (Desktop Only) -->
    <div class="auth-brand-panel">
      <div class="auth-brand-logo">
        CRAZY<br><span>CLOTHS</span>
      </div>
      <div class="auth-brand-tagline">Wear Your Vision</div>
      
      <div class="auth-brand-pills">
        <div class="auth-brand-pill">Custom Prints</div>
        <div class="auth-brand-pill">Fast Delivery</div>
        <div class="auth-brand-pill">Premium Cotton</div>
      </div>
    </div>

    <!-- RIGHT: Form Panel -->
    <div class="auth-form-panel">
      <div class="auth-card">
        
        <!-- Mobile Logo -->
        <div class="auth-mobile-logo">
          CRAZY <span>CLOTHS</span>
        </div>

        <!-- Tabs -->
        <div class="auth-tabs-container">
          <div class="auth-tabs" role="tablist">
            <button class="auth-tab active" id="tab-customer" role="tab" aria-selected="true"
                    onclick="switchTab('customer')">Customer</button>
            <button class="auth-tab" id="tab-admin" role="tab" aria-selected="false"
                    onclick="switchTab('admin')">Admin</button>
            <div class="tab-indicator" id="tab-indicator"></div>
          </div>
        </div>

        <!-- ── CUSTOMER PANEL ── -->
        <div class="form-panel active" id="panel-customer">

          <!-- Login sub-panel -->
          <div id="sub-login">
            <h2 class="auth-form-title" style="font-family:var(--font-display);font-size:1.8rem;text-transform:uppercase;margin-bottom:1.5rem;">Welcome Back</h2>
            <div id="customer-msg" class="auth-message"></div>

            <div class="input-group">
              <input type="email" id="cust-email" placeholder=" " autocomplete="email" class="form-input-premium">
              <label for="cust-email" class="form-label">Email Address</label>
            </div>
            
            <div class="input-group">
              <input type="password" id="cust-password" placeholder=" " autocomplete="current-password" class="form-input-premium">
              <label for="cust-password" class="form-label">Password</label>
              <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('cust-password', this)" tabindex="-1">
                <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>

            <button class="btn btn-premium" onclick="handleCustomerLogin()" style="margin-top: 1.5rem;">
              Login
            </button>

            <p class="auth-toggle-link">
              Don't have an account? <span onclick="showRegister()">Register here</span>
            </p>
          </div>

          <!-- Register sub-panel (hidden by default) -->
          <div id="sub-register" style="display:none;">
            <h2 class="auth-form-title" style="font-family:var(--font-display);font-size:1.8rem;text-transform:uppercase;margin-bottom:1.5rem;">Create Account</h2>
            <div id="register-msg" class="auth-message"></div>

            <div class="input-group">
              <input type="text" id="reg-name" placeholder=" " autocomplete="name" class="form-input-premium">
              <label for="reg-name" class="form-label">Full Name</label>
            </div>
            
            <div class="input-group">
              <input type="email" id="reg-email" placeholder=" " autocomplete="email" class="form-input-premium">
              <label for="reg-email" class="form-label">Email Address</label>
            </div>
            
            <div class="input-group">
              <input type="tel" id="reg-phone" placeholder=" " autocomplete="tel" class="form-input-premium">
              <label for="reg-phone" class="form-label">Phone Number</label>
            </div>
            
            <div class="input-group">
              <input type="password" id="reg-password" placeholder=" " autocomplete="new-password" class="form-input-premium">
              <label for="reg-password" class="form-label">Password</label>
              <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('reg-password', this)" tabindex="-1">
                <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
            
            <div class="input-group">
              <input type="password" id="reg-confirm" placeholder=" " autocomplete="new-password" class="form-input-premium">
              <label for="reg-confirm" class="form-label">Confirm Password</label>
              <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('reg-confirm', this)" tabindex="-1">
                <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>

            <button class="btn btn-premium" onclick="handleRegister()" style="margin-top: 1.5rem;">
              Create Account
            </button>
            <p class="auth-toggle-link">
              Already have an account? <span onclick="showLogin()">Login here</span>
            </p>
          </div>

        </div>

        <!-- ── ADMIN PANEL ── -->
        <div class="form-panel" id="panel-admin">
          <h2 class="auth-form-title" style="font-family:var(--font-display);font-size:1.8rem;text-transform:uppercase;margin-bottom:1.5rem;">Admin Access</h2>
          <div id="admin-msg" class="auth-message"></div>

          <div class="input-group">
            <input type="email" id="admin-email" placeholder=" " autocomplete="email" class="form-input-premium">
            <label for="admin-email" class="form-label">Admin Email</label>
          </div>
          
          <div class="input-group">
            <input type="password" id="admin-password" placeholder=" " autocomplete="current-password" class="form-input-premium">
            <label for="admin-password" class="form-label">Password</label>
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('admin-password', this)" tabindex="-1">
              <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>

          <button class="btn btn-premium" onclick="handleAdminLogin()" style="margin-top: 1.5rem;">
            Admin Login
          </button>
          <p style="font-family:var(--font-mono);font-size:0.68rem;color:var(--color-text-secondary);text-align:center;margin-top:1.5rem;">
            Access restricted to authorised staff only.
          </p>
        </div>

      </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="config.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>

  <script>
    // ── Redirect if already logged in ──────────────────────
    if (typeof firebase !== 'undefined' && CONFIG.firebaseEnabled) {
      firebase.auth().onAuthStateChanged((user) => {
        if (!user) return;
        const redirect = sessionStorage.getItem('cc_redirect_after_login');
        if (redirect) {
          sessionStorage.removeItem('cc_redirect_after_login');
          window.location.href = redirect;
        } else if (AuthService.isAdmin()) {
          window.location.href = 'admin/dashboard.html';
        } else {
          window.location.href = 'index.html';
        }
      });
    }

    // ── Tab switching ──────────────────────────────────────
    function switchTab(tab) {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.form-panel').forEach(p => {
        p.classList.remove('active');
      });

      const activeTab = document.getElementById(`tab-${tab}`);
      activeTab.classList.add('active');
      
      const indicator = document.getElementById('tab-indicator');
      if (tab === 'customer') {
        indicator.style.transform = 'translateX(0)';
      } else {
        indicator.style.transform = 'translateX(100%)';
      }

      document.getElementById(`panel-${tab}`).classList.add('active');
    }

    function showRegister() {
      document.getElementById('sub-login').style.display = 'none';
      document.getElementById('sub-register').style.display = 'flex';
      document.getElementById('sub-register').style.flexDirection = 'column';
    }

    function showLogin() {
      document.getElementById('sub-register').style.display = 'none';
      document.getElementById('sub-login').style.display = 'block';
    }

    // ── Password Visibility Toggle ────────────────────────
    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = `
          <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <line x1="1" y1="1" x2="23" y2="23"></line>
            <path d="M9 9a3 3 0 1 1-3 3"></path>
            <path d="M17 17a10 10 0 0 1-13-13"></path>
            <path d="M21 21a10 10 0 0 1-13-13"></path>
            <path d="M1 12s4-8 11-8a10 10 0 0 1 8 4"></path>
            <path d="M23 12a10 10 0 0 1-8 8"></path>
          </svg>
        `;
      } else {
        input.type = 'password';
        btn.innerHTML = `
          <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        `;
      }
    }

    // ── Shake & Success UI Utilities ──────────────────────
    function triggerShake(el) {
      if (!el) return;
      el.classList.add('error-shake');
      setTimeout(() => { el.classList.remove('error-shake'); }, 400);
    }

    function showSuccessState(btn) {
      btn.classList.add('btn-success-state');
      btn.innerHTML = `
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="margin-right:8px;">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        Success
      `;
    }

    // ── Helpers ───────────────────────────────────────────
    function showMsg(id, msg, type = 'error') {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.className = `auth-message ${type} visible`;
    }

    function setLoading(btn, loading) {
      btn.disabled = loading;
      if (loading) {
        if (!btn.dataset.label) btn.dataset.label = btn.textContent;
        btn.innerHTML = '<span style="display:inline-block;width:20px;height:20px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;"></span>';
      } else {
        btn.textContent = btn.dataset.label || 'Login';
      }
    }

    // ── Handlers ─────────────────────────────────────────
    async function handleCustomerLogin() {
      const email    = document.getElementById('cust-email').value.trim();
      const password = document.getElementById('cust-password').value;
      const btn      = document.querySelector('#panel-customer button.btn-premium');
      const card     = document.querySelector('.auth-card');
      if (!email || !password) {
        showMsg('customer-msg','Please fill in all fields.');
        triggerShake(card);
        return;
      }
      
      setLoading(btn, true);
      try {
        await AuthService.loginCustomer(email, password);
        showSuccessState(btn);
        setTimeout(() => {
          const redirect = sessionStorage.getItem('cc_redirect_after_login');
          sessionStorage.removeItem('cc_redirect_after_login');
          window.location.href = redirect || 'index.html';
        }, 800);
      } catch (e) {
        setLoading(btn, false);
        showMsg('customer-msg', e.message || 'Login failed. Please try again.');
        triggerShake(card);
      }
    }

    async function handleRegister() {
      const name     = document.getElementById('reg-name').value.trim();
      const email    = document.getElementById('reg-email').value.trim();
      const phone    = document.getElementById('reg-phone').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirm  = document.getElementById('reg-confirm').value;
      const btn      = document.querySelector('#sub-register button.btn-premium');
      const card     = document.querySelector('.auth-card');
      
      if (!name || !email || !password || !confirm) {
        showMsg('register-msg','Please fill in all fields.');
        triggerShake(card);
        return;
      }
      if (password !== confirm) {
        showMsg('register-msg','Passwords do not match.');
        triggerShake(card);
        return;
      }
      if (password.length < 6)  {
        showMsg('register-msg','Password must be at least 6 characters.');
        triggerShake(card);
        return;
      }
      
      setLoading(btn, true);
      try {
        await AuthService.registerCustomer(name, email, phone, password);
        showSuccessState(btn);
        showMsg('register-msg','Account created! Redirecting...', 'success');
        setTimeout(() => { window.location.href = 'index.html'; }, 1000);
      } catch (e) {
        setLoading(btn, false);
        showMsg('register-msg', e.message || 'Registration failed.');
        triggerShake(card);
      }
    }

    async function handleAdminLogin() {
      const email    = document.getElementById('admin-email').value.trim();
      const password = document.getElementById('admin-password').value;
      const btn      = document.querySelector('#panel-admin button.btn-premium');
      const card     = document.querySelector('.auth-card');
      
      if (!email || !password) {
        showMsg('admin-msg','Please enter your admin email and password.');
        triggerShake(card);
        return;
      }
      
      setLoading(btn, true);
      try {
        await AuthService.loginAdmin(email, password);
        showSuccessState(btn);
        setTimeout(() => { window.location.href = 'admin/dashboard.html'; }, 800);
      } catch (e) {
        setLoading(btn, false);
        showMsg('admin-msg', e.message || 'Admin login failed.');
        triggerShake(card);
      }
    }

    // Page Transition Sweeper Init
    document.addEventListener('DOMContentLoaded', () => {
      // Page Transition Out Sweep
      const overlay = document.getElementById('page-transition-overlay');
      if (overlay) {
        overlay.classList.add('active-out');
        setTimeout(() => { overlay.classList.remove('active-out'); }, 600);
        
        const links = document.querySelectorAll('a');
        links.forEach(link => {
          const href = link.getAttribute('href');
          if (href && !href.startsWith('#') && !href.startsWith('mailto:') && !link.getAttribute('target')) {
            link.addEventListener('click', (e) => {
              e.preventDefault();
              overlay.classList.add('active-in');
              setTimeout(() => { window.location.href = href; }, 550);
            });
          }
        });
      }
    });
  </script>
</body>
</html>
